project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - posts/*/index.qmd

website:
  title: "Investigating Series"
  description: "Exploring financial markets through data, models and code."
  site-url: https://gustavobjorgefo.github.io/investigatingseries/
  repo-url: https://github.com/gustavobjorgefo/investigatingseries
  draft-mode: unlinked
  navbar:
    left:
      - href: index.qmd
        text: Posts
    right:
      - text: Substack
        href: https://gustavojorgefilho.substack.com
      - icon: github
        href: https://github.com/gustavobjorgefo/investigatingseries

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    code-fold: true
    code-tools: true
    fig-cap-location: bottom
    fig-width: 8
    fig-height: 4
    css: styles.css
    mainfont: "IBM Plex Sans, Helvetica, Arial, sans-serif"
    monofont: "IBM Plex Mono, Consolas, monospace"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

execute:
  freeze: auto
